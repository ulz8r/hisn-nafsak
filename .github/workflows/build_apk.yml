name: Build Android APK (حصن نفسك)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Hisn-Nafsak-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Nafsak-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0-official
          name: "تطبيق حصن نفسك - الإصدار الرسمي الأول v1.0"
          draft: false
          prerelease: false
          body: |
            ### تطبيق حصن نفسك — الإصدار الرسمي الأول المتكامل v1.0 📱✨

            تطبيق إسلامي شامل باسم **«حصن نفسك»** مع شعار وأيقونة احترافية جديدة وخالية تماماً من النصوص، وجاهز للتثبيت المباشر على هواتف الأندرويد.

            #### أقسام ومحتويات التطبيق الكاملة:
            - **أذكار الصباح والمساء**: بعدادات تفاعلية وتنبيهات وتصميم متناسق.
            - **أذكار بعد الصلاة المفروضة**: بالنصوص والتشكيل والأعداد الكاملة.
            - **أذكار النوم والاستيقاظ**: أذكار النوم الصحيحة (٩) وأذكار الاستيقاظ (٣) مع العداد التفاعلي.
            - **فضائل الأذكار**: أحاديث نبوية صحيحة ومخرجة في فضل الذكر والتسبيح وغفران الذنوب.
            - **قسم معلومات الديني**:
              - *معلومات عن الصلاة* (١٧ موضوعاً فقهياً وعلمياً متكاملاً).
              - *محظورات الصلاة* (٤ موضوعات مصورة بالرسومات التوضيحية والأدلة).
              - *محظورات المسجد* (موضوعان مصوران بالرسومات التوضيحية والأدلة).
            - **القرآن الكريم**: تصفح وقراءة جزء عمّ وجزء تبارك بدقة عالية وحفظ آخر موضع.
            - **الأربعون النووية**: كتاب الأربعين النووية كاملاً.
            - **محاسبة النفس اليومية**: متابعة الصلوات الخمس بمربعات (نعم/لا) للجماعة والأداء، والسنن الرواتب، والأعمال اليومية، ووقفة مع نفسك بأيقونة الميزان.
            - **المسبحة الإلكترونية**: عدادات تفاعلية قابلة للتخصيص.

            قم بتحميل ملف **`Hisn-Nafsak-v1.0.apk`** أو **`app-release.apk`** أدناه مباشرة على هاتفك لتثبيته.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/Hisn-Nafsak-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
